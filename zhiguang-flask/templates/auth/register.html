{% extends "base.html" %}
{% block title %}注册{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-accent/5 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-br from-accent to-accent-dark items-center justify-center mb-4">
        <i data-lucide="user-plus" class="w-7 h-7 text-white"></i>
      </div>
      <h1 class="font-sans text-2xl font-bold text-text-main">加入织光</h1>
      <p class="text-text-dim text-sm mt-2">开启你的思维破壁之旅</p>
    </div>

    <div class="rounded-2xl bg-white border border-border-l p-8">
      <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-5">
        <div>
          <label class="block text-sm text-text-dim mb-1.5">用户名</label>
          <input type="text" name="username" required autofocus minlength="2" maxlength="20"
            class="w-full px-4 py-3 rounded-xl bg-bg-main border border-border-l text-text-main placeholder-text-dim/50 focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/50 transition-colors"
            placeholder="2-20位字符">
        </div>
        <div>
          <label class="block text-sm text-text-dim mb-1.5">邮箱</label>
          <input type="email" name="email" required
            class="w-full px-4 py-3 rounded-xl bg-bg-main border border-border-l text-text-main placeholder-text-dim/50 focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/50 transition-colors"
            placeholder="your@email.com">
        </div>
        <div>
          <label class="block text-sm text-text-dim mb-1.5">密码</label>
          <input type="password" name="password" required minlength="6"
            class="w-full px-4 py-3 rounded-xl bg-bg-main border border-border-l text-text-main placeholder-text-dim/50 focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/50 transition-colors"
            placeholder="至少6位">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-accent text-white font-medium hover:bg-accent-dark transition-colors flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
          <span>创建账户</span>
        </button>
      </form>

      <p class="text-center text-sm text-text-dim mt-6">
        已有账户？<a href="{{ url_for('auth.login') }}" class="text-accent hover:underline">直接登录</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
