# Render 部署配置
# 访问 https://render.com 部署

services:
  - type: web
    name: zhiguang-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///instance/zhiguang.db
